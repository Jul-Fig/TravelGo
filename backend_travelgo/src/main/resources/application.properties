# ─────────────────────────────────────────────────────────────────────────────
# Perfil PRODUCCIÓN — Railway
#
# Railway inyecta automáticamente las variables de entorno que configures
# en el panel. Las sintaxis ${VAR:default} usa "default" si la var no existe.
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=backend_travelgo

# ─── Base de datos ────────────────────────────────────────────────────────────
# Railway genera estas variables automáticamente cuando agregas un plugin MySQL.
# No las copies a mano; Railway las inyecta en tiempo de ejecución.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones — valores seguros para el tier gratuito de Railway
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# update: crea/altera tablas en el primer arranque. Cambia a "validate" después.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ─── Servidor ─────────────────────────────────────────────────────────────────
# Railway asigna el puerto en $PORT; Spring lo lee aquí.
server.port=${PORT:8080}

# ─── Amadeus ──────────────────────────────────────────────────────────────────
amadeus.client.id=${AMADEUS_CLIENT_ID}
amadeus.client.secret=${AMADEUS_CLIENT_SECRET}

# ─── Email ────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Reemplaza con la URL real de tu frontend en Vercel después del deploy.
# Ejemplo: https://travelgo.vercel.app
app.cors.allowed-origins=${FRONTEND_URL:https://travelgo.vercel.app}

# ─── Logs ─────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.travelgo=INFO
logging.level.org.springframework.security=WARN